[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questoes-em"
version = "0.1.0"
description = "Sistema multiagente para geração assistida de questões de Matemática do Ensino Médio (PROFMAT/UFMT)"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Provedores de LLM: instale apenas o que for usar.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
# Gemini e DeepSeek falam o protocolo de chat da OpenAI: mesma biblioteca, outro
# endereço. Os extras existem para quem procura pelo nome do serviço.
gemini = ["openai>=1.40"]
deepseek = ["openai>=1.40"]
ollama = ["httpx>=0.27"]
# A dupla latex2mathml+mathml2omml é o que transforma `$\\frac{a}{b}$` em equação
# de verdade no Word. É pip puro (sem Pandoc, sem Node) e opcional: sem ela a
# lista continua saindo, com a fórmula em texto.
docx = ["python-docx>=1.1", "latex2mathml>=3.77", "mathml2omml>=0.0.2"]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-docx>=1.1",
       "latex2mathml>=3.77", "mathml2omml>=0.0.2"]
dev = ["pytest>=8.0", "fastapi>=0.110", "python-docx>=1.1",
       "latex2mathml>=3.77", "mathml2omml>=0.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." dá acesso ao pacote api/; "tests" permite reaproveitar os fakes entre módulos.
pythonpath = ["src", ".", "tests"]
