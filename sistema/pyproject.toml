[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questoes-em"
version = "0.1.0"
description = "Sistema multiagente para geração assistida de questões de Matemática do Ensino Médio (PROFMAT/UFMT)"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.12",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# Provedores de LLM: instale apenas o que for usar.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
ollama = ["httpx>=0.27"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
